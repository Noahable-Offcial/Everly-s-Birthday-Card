<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="A little birthday surprise for Everly.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Everly 💗">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>A Birthday Surprise for Everly 💗</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@600;700;800&display=swap');
    :root{--pink:#f6a9c5;--deep:#d94f86;--cream:#fffaf4;--ink:#633d55}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;overflow-x:hidden;color:var(--ink);font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 15% 10%,#fff 0,transparent 36%),radial-gradient(ellipse at 90% 80%,#ffe0eb 0,transparent 38%),linear-gradient(135deg,#fff3f6,#ffe7ef 48%,#fff8ee);display:grid;place-items:center;padding:28px 16px}
    body:before,body:after{content:"✦　♡　✧　♡　✦";position:fixed;color:#e78eaf;opacity:.32;font-size:22px;letter-spacing:18px;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}
    body:before{top:8%;left:-25px;transform:rotate(-18deg)}body:after{bottom:9%;right:-25px;transform:rotate(16deg);animation-delay:-5s}
    @keyframes drift{to{translate:0 18px;rotate:5deg}}
    .scene{width:min(100%,560px);text-align:center;position:relative;z-index:1}
    .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:#c56b91;margin:0 0 12px}
    h1{font:clamp(30px,7vw,48px)/1.12 'Playfair Display',serif;color:#9c456d;margin:0 0 9px}
    .intro{margin:0 auto 25px;color:#956b80;font-size:14px}
    .stage{height:390px;display:grid;place-items:center;perspective:1100px;position:relative}
    .envelope{position:relative;width:min(88vw,390px);height:245px;margin-top:54px;filter:drop-shadow(0 20px 24px #b65b7b2b);transition:filter .5s}
    .env-back{position:absolute;inset:0;background:#f4a9c2;border-radius:8px 8px 15px 15px;overflow:hidden}
    .env-back:before,.env-back:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
    .env-back:before{left:0;border-width:0 0 190px 195px;border-color:transparent transparent #ed8fb0 transparent}
    .env-back:after{right:0;border-width:190px 0 0 195px;border-color:transparent transparent transparent #f8bfd0}
    .env-front{position:absolute;inset:0;background:linear-gradient(145deg,#f9c2d3,#ed91b2);clip-path:polygon(0 100%,50% 43%,100% 100%);border-radius:0 0 13px 13px;z-index:4}
    .flap{position:absolute;inset:0 0 auto;height:62%;border:0;padding:0;background:#f7b3c9;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.2,.75,.25,1);z-index:6;cursor:pointer}
    .flap:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffd5e1aa,#e985a9aa)}
    .seal{position:absolute;z-index:7;left:50%;top:47%;translate:-50% -50%;width:49px;height:49px;border-radius:50%;background:linear-gradient(145deg,#fff4f7,#ffe0ea);box-shadow:0 3px 10px #a64c7130;display:grid;place-items:center;font-size:23px;transition:opacity .25s,scale .4s;pointer-events:none}
    .letter{position:absolute;z-index:3;left:5%;width:90%;height:88%;bottom:5px;border-radius:8px;background:linear-gradient(160deg,#fffefa,#fff5f7);box-shadow:0 4px 18px #9e496b22;padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.18,.8,.2,1),bottom 1s;cursor:pointer}
    .letter .mini{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#cf7398}
    .letter .hat{font-size:40px;margin:4px}
    .letter strong{font:24px 'Pacifico',cursive;color:#d45c8b}
    .letter small{margin-top:7px;color:#ad8195}
    .envelope.open .flap{transform:rotateX(180deg);z-index:2}
    .envelope.open .seal{opacity:0;scale:.5}
    .envelope.open .letter{transform:translateY(-135px);bottom:5px;z-index:5}
    .envelope.card-out .letter{transform:translateY(-155px) scale(1.045);z-index:8;box-shadow:0 14px 35px #9e496b35}
    .envelope.card-open .letter{height:auto;min-height:310px;max-height:min(70svh,460px);overflow-y:auto;bottom:-40px;transform:translateY(-130px) scale(1.03);z-index:9;padding:24px 22px}
    .envelope.card-open .letter .inside{display:flex}
    .inside{display:none;flex-direction:column;align-items:center;gap:10px;animation:appear .7s .2s both}
    @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .inside .big-hat{font-size:44px;line-height:1}
    .inside h2{font:clamp(26px,6vw,34px) 'Pacifico',cursive;color:#d34f85;margin:0}
    .inside p{font:15px/1.75 'DM Sans',sans-serif;color:#80566b;margin:0;max-width:270px}
    .inside .signoff{font:20px 'Pacifico',cursive;color:#d34f85;margin-top:3px}
    .inside .age{background:#fff0f5;border:1px solid #f6c5d7;border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;color:#bd5a83}
    .inside .sparkles{font-size:20px;letter-spacing:8px}
    .hint{margin:10px 0 0;font-size:13px;color:#a16d86;min-height:20px}
    .replay{margin-top:12px;border:1px solid #efb2c9;background:#fff9fb;color:#b34d79;padding:10px 17px;border-radius:999px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
    .replay.show{opacity:1;pointer-events:auto}
    button:focus-visible{outline:3px solid #b94f7c;outline-offset:5px}
    .confetti{position:fixed;top:-15px;z-index:20;pointer-events:none;animation:fall linear forwards;font-size:18px}
    @keyframes fall{to{transform:translate3d(var(--sway),110vh,0) rotate(680deg);opacity:.2}}
    @media(max-height:700px){.stage{height:340px}.envelope{transform:scale(.88);margin-top:35px}.envelope.card-open .letter{transform:translateY(-105px) scale(.98)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="scene">
    <p class="eyebrow">A little birthday surprise</p>
    <h1>Something special for Everly</h1>
    <p class="intro">A tiny envelope, with a very big birthday wish. 💗</p>
    <section class="stage" aria-label="Interactive birthday card">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <button class="letter" id="letter" type="button" aria-label="Open the birthday card">
          <span class="mini">A little note for you</span>
          <span class="hat">🥳</span>
          <strong>Happy 2nd Birthday Everly!</strong>
          <small>Tap to read your surprise ♡</small>
          <div class="inside">
            <div class="sparkles">✦ ♡ ✦</div>
            <div class="big-hat">🎂🎉</div>
            <span class="age">2ND BIRTHDAY 💕</span>
            <h2>To Everly,</h2>
            <p>Happy 2nd Birthday Everly!</p>
            <div class="signoff">Love from Noah ♡</div>
            <div class="sparkles">✧ 🎈 ✧</div>
          </div>
        </button>
        <div class="env-front"></div>
        <button class="flap" id="flap" type="button" aria-label="Open the envelope"></button>
        <div class="seal" aria-hidden="true">💌</div>
      </div>
    </section>
    <p class="hint" id="hint" aria-live="polite">Tap the little heart seal to open your envelope</p>
    <button class="replay" id="replay" type="button">↻ Close the card and watch again</button>
  </main>
  <script>
    const envelope=document.getElementById('envelope');
    const flap=document.getElementById('flap');
    const letter=document.getElementById('letter');
    const hint=document.getElementById('hint');
    const replay=document.getElementById('replay');
    let stage=0;
    function celebrate(){
      const bits=['💗','✨','🎉','🎈','🌸','⭐'];
      for(let i=0;i<34;i++){
        const el=document.createElement('span');el.className='confetti';
        el.textContent=bits[Math.floor(Math.random()*bits.length)];
        el.style.left=Math.random()*100+'vw';
        el.style.setProperty('--sway',(Math.random()*180-90)+'px');
        el.style.animationDuration=(3+Math.random()*2)+'s';
        el.style.animationDelay=(Math.random()*.7)+'s';
        document.body.appendChild(el);setTimeout(()=>el.remove(),6000);
      }
    }
    flap.addEventListener('click',()=>{
      if(stage!==0)return;stage=1;envelope.classList.add('open');
      hint.textContent='Your birthday letter is popping out…';
      setTimeout(()=>{envelope.classList.add('card-out');hint.textContent='Now tap the letter to open your birthday message!';},850);
    });
    letter.addEventListener('click',()=>{
      if(stage===0){flap.click();return}
      if(stage!==1)return;stage=2;envelope.classList.add('card-open');
      hint.textContent='Happy 2nd Birthday, Everly! Have the BEST day! 💗';
      replay.classList.add('show');celebrate();
    });
    replay.addEventListener('click',()=>{
      stage=0;envelope.classList.remove('open','card-out','card-open');
      hint.textContent='Tap the little heart seal to open your envelope';
      replay.classList.remove('show');
    });
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  </script>
</body>
</html>
